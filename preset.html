<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>战前配置 · 三方战略战术（战略树配置台）[v0.4]</title>
<style>
  :root{
    --bg:#071119; --panel:#0e1f2e; --line:rgba(120,180,220,.22);
    --txt:#dbeaf6; --dim:#8ba7bb; --red:#ff7a5c; --blue:#5fc8ff; --green:#63d98a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#0d2434,#050c12 70%);
       color:var(--txt);font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
  header{padding:18px 26px 10px;border-bottom:1px solid var(--line)}
  header h1{margin:0 0 4px;font-size:19px;letter-spacing:.03em}
  header h1 span{color:var(--dim);font-size:12px;font-weight:400;margin-left:8px}
  header p{margin:0;color:var(--dim);font-size:12.5px;max-width:1100px}
  .wrap{max-width:1440px;margin:0 auto;padding:16px 22px 110px}
  .tri{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .tabs{display:none;gap:6px;margin-bottom:12px}
  .tab{flex:1;background:rgba(30,62,88,.5);border:1px solid rgba(120,180,220,.3);color:#cfe4f4;
       border-radius:8px;padding:8px 6px;font:inherit;font-size:12.5px;cursor:pointer;text-align:center}
  .tab.on{background:rgba(60,140,220,.42);border-color:#7fdcff;color:#fff;font-weight:600}
  .tab.t-red.on{background:rgba(190,80,55,.42);border-color:#ff9d84}
  .tab.t-green.on{background:rgba(60,150,100,.42);border-color:#63d98a}
  .side{background:linear-gradient(180deg,rgba(20,42,60,.9),rgba(12,26,38,.95));
        border:1px solid var(--line);border-radius:12px;padding:12px 13px 14px;position:relative}
  .side::before{content:'';position:absolute;left:0;top:0;right:0;height:3px;border-radius:12px 12px 0 0}
  .side.red::before{background:linear-gradient(90deg,#ff5b4a,#ffb08a)}
  .side.blue::before{background:linear-gradient(90deg,#2e9bd6,#7fe0ff)}
  .side.green::before{background:linear-gradient(90deg,#3f9e63,#9fe6b4)}
  .side h2{margin:4px 0 2px;font-size:14.5px}
  .side .sub{color:var(--dim);font-size:11.5px;margin-bottom:9px}
  .grp{margin-top:10px}
  .grp>label{display:block;font-size:11.5px;color:#9fb8cb;margin-bottom:4px;letter-spacing:.02em}
  .opts{display:flex;flex-wrap:wrap;gap:5px}
  .opt{background:rgba(30,62,88,.55);border:1px solid rgba(120,180,220,.3);color:#cfe4f4;
       border-radius:6px;padding:4px 9px;font:inherit;font-size:12px;cursor:pointer;transition:.12s}
  .opt:hover{background:rgba(50,100,140,.7);border-color:#7fc4e8}
  .opt.on{background:rgba(70,150,110,.5);border-color:#63d98a;color:#eaffef;font-weight:600}
  .side.red .opt.on{background:rgba(190,80,55,.5);border-color:#ff9d84;color:#fff1ec}
  .side.blue .opt.on{background:rgba(40,120,175,.55);border-color:#7fdcff;color:#f0fbff}
  .path{margin-top:11px;padding:7px 9px;border:1px dashed var(--line);border-radius:7px;
        font-size:11.5px;color:#a9c2d6;line-height:1.5;min-height:34px}
  .path b{color:#eaf6ff;font-weight:600}
  footer{position:fixed;left:0;right:0;bottom:0;background:rgba(7,17,25,.96);
         border-top:1px solid var(--line);padding:11px 22px;backdrop-filter:blur(8px)}
  .fbar{max-width:1440px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .url{flex:1;min-width:260px;font-family:Consolas,monospace;font-size:11px;color:#7fb6d8;
       background:rgba(20,42,60,.8);border:1px solid var(--line);border-radius:6px;padding:6px 9px;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{background:rgba(60,140,220,.28);border:1px solid #63b3ff;color:#e6f5ff;border-radius:7px;
       padding:8px 18px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
  .btn:hover{background:rgba(60,140,220,.44)}
  .btn.go{background:rgba(60,170,100,.3);border-color:#63d98a;color:#eaffef}
  .btn.go:hover{background:rgba(60,170,100,.46)}
  .hint{width:100%;color:var(--dim);font-size:11.5px;margin-top:2px}
  @media (max-width:900px){.tri{grid-template-columns:1fr}.tabs{display:flex}}
</style>
</head>
<body>
<header>
  <h1>战前配置 · 三方战略战术<span>每方一条独立战略树 · 同一战场碰撞</span>
    <a href="strategy.html" style="font-size:12px;color:#7fdcff;text-decoration:none;border:1px solid rgba(120,180,220,.4);border-radius:12px;padding:2px 12px;white-space:nowrap;float:right" title="战略层独立页：图A 战前决策收敛树 + 图B 战时执行应变树（MDMP 影响图 / 作战线 / branches &amp; sequels）">⌳ 看战略层两图 ↗</a></h1>
  <p>先选本方的<b>战略</b>（三个预案），再定<b>分支走向</b>（战术级变量）。配置存本地并写入 URL：可以分享、可以复现、可以战后再改。
     三方各配各的，互不覆盖——这就是"三个剧本在同一个战场上碰撞"，不是一套剧本三方演。</p>
</header>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="tri" id="tri"></div>
</div>

<footer>
  <div class="fbar">
    <div class="url" id="urlBox">—</div>
    <button class="btn" id="saveBtn">保存配置</button>
    <a class="btn go" id="goBtn">▶ 保存并开演</a>
    <div class="hint">开演后仍可在战场页点顶栏方案名打开「战略台」，随时换案 / 打断接管 / 调整介入姿态。</div>
  </div>
</footer>

<script>
const SIDE_META={
  red  :{key:'red',  n:'红方 · PLA 突击',  sub:'攻方：跨海突击、夺制空、抢滩上陆、攻入台北'},
  blue :{key:'blue', n:'蓝方 · 台军守备',  sub:'守方：滨海拒止、纵深阻滞、城市巷战'},
  green:{key:'green',n:'绿方 · 美军介入',  sub:'介入方：防区外远程火力 + 潜艇伏击 + 舰载机'},
};

const BRANCH={
  red:{
    preset:{n:'战略（战役法）'},
    beach:{n:'主登陆滩头',opts:[['auto','按预案'],['b1','白沙滩头（新竹）'],['b2','澜湾滩头（彰化）'],['b3','石矶滩头（台南）']]},
    jfs:{n:'联合火力准备强度',opts:[['0.6','急袭（省弹快打）'],['1','标准（四波）'],['1.5','重压（+50% 弹量）']]},
    vertical:{n:'垂直包围（机降）',opts:[['auto','按预案'],['on','强制机降桃园'],['off','不机降']]},
  },
  blue:{
    preset:{n:'战略（防御法）'},
    hold:{n:'伏击圈距岸',opts:[['auto','按预案'],['0','贴岸死守 0km'],['30','纵深让开 30km'],['40','远海伏击 40km']]},
    urban:{n:'台北巷战强度',opts:[['0.6','保存实力'],['1','标准'],['1.6','死守（反装甲 +60%）']]},
    reserve:{n:'预备队规模',opts:[['auto','按预案'],['0','不留预备队'],['2','加强（+2 营）']]},
  },
  green:{
    preset:{n:'战略（介入样式）'},
    posture:{n:'介入姿态（决定打不打）',opts:[['isr','情报支援（不开火）'],['limited','有限介入（300km 内交战）'],['full','全面介入（全射程）']]},
    

    roe:{n:'交战规则',opts:[['auto','随姿态'],['tight','严格：200km 仅自卫'],['full','全域：370km（SM-6 公开上限）']]},
    typhon:{n:'陆基远程火力（吕宋堤丰连）',opts:[['on','启用'],['off','不启用']]},
  },
};

let CFG={red:{},blue:{},green:{}};
let PRESETS=null;
let CUR='red';   
const NARROW=()=>window.matchMedia('(max-width:900px)').matches;

function loadCfg(){
  try{
    const q=new URLSearchParams(location.search);
    const raw=q.get('cfg');
    if(raw)CFG=JSON.parse(decodeURIComponent(raw));
    else CFG=JSON.parse(localStorage.getItem('canglan_cfg')||'{}')||{};
  }catch(e){CFG={};}
  ['red','blue','green'].forEach(s=>{
    CFG[s]=CFG[s]||{};
    CFG[s].preset=CFG[s].preset||'pa';
  });
  
  const q2=new URLSearchParams(location.search);
  if(q2.get('gposture'))CFG.green.posture=q2.get('gposture');
  if(q2.get('side'))location.hash=q2.get('side');
}
function presetName(side,id){
  const key=SIDE_META[side].key;
  const list=(PRESETS&&PRESETS[key])||[];
  const p=list.find(x=>x.id===id);
  return p?(p.n||id):id.toUpperCase();
}
function branchVal(side,k){
  const b=BRANCH[side][k];
  const v=CFG[side][k];
  if(v!==undefined)return v;
  return b.opts[0][0];
}
function render(){
  const tabBar=document.getElementById('tabs');
  const sidesNarrow=NARROW();
  if(tabBar){
    tabBar.style.display=sidesNarrow?'flex':'none';
    tabBar.innerHTML=['red','blue','green'].map(s=>
      `<button class="tab t-${s}${CUR===s?' on':''}" data-tab="${s}">${SIDE_META[s].n.replace(' · ','·')}</button>`).join('');
    tabBar.querySelectorAll('.tab').forEach(b=>{b.onclick=()=>{CUR=b.dataset.tab;render();};});
  }
  const show=sidesNarrow?[CUR]:['red','blue','green'];
  const tri=document.getElementById('tri');
  tri.innerHTML=show.map(side=>{
    const meta=SIDE_META[side];
    const keys=Object.keys(BRANCH[side]);
    const groups=keys.map(k=>{
      const b=BRANCH[side][k];
      if(k==='preset'){
        const key=meta.key;
        const list=(PRESETS&&PRESETS[key])||[{id:'pa',n:'预案 A'},{id:'pb',n:'预案 B'},{id:'pc',n:'预案 C'}];
        const opts=list.map(p=>`<button class="opt${CFG[side].preset===p.id?' on':''}" data-side="${side}" data-k="preset" data-v="${p.id}">${esc(p.n||p.id)}</button>`).join('');
        return `<div class="grp"><label>${b.n}</label><div class="opts">${opts}</div></div>`;
      }
      const cur=branchVal(side,k);
      const opts=b.opts.map(([v,label])=>`<button class="opt${String(cur)===String(v)?' on':''}" data-side="${side}" data-k="${k}" data-v="${v}">${esc(label)}</button>`).join('');
      return `<div class="grp"><label>${b.n}</label><div class="opts">${opts}</div></div>`;
    }).join('');
    return `<section class="side ${side}" id="side-${side}">
      <h2>${meta.n}</h2><div class="sub">${meta.sub}</div>
      ${groups}
      <div class="path" id="path-${side}"></div>
    </section>`;
  }).join('');
  tri.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      const side=b.dataset.side,k=b.dataset.k,v=b.dataset.v;
      CFG[side][k]=v;
      if(k==='preset'){
        
      }
      render(); sync();
    };
  });
  paintPaths();
}
function paintPaths(){
  ['red','blue','green'].forEach(side=>{
    const el=document.getElementById('path-'+side); if(!el)return;
    const parts=[`<b>${esc(presetName(side,CFG[side].preset))}</b>`];
    Object.keys(BRANCH[side]).forEach(k=>{
      if(k==='preset')return;
      const v=branchVal(side,k);
      const o=BRANCH[side][k].opts.find(x=>String(x[0])===String(v));
      parts.push((o?esc(o[1]):v));
    });
    el.innerHTML='路径：'+parts.join(' → ');
  });
}
function buildUrl(){
  const q=new URLSearchParams();
  const map={red:'l5red',blue:'l5blue',green:'l5green'};
  ['red','blue','green'].forEach(s=>{ if(CFG[s].preset)q.set(map[s],CFG[s].preset); });
  if(CFG.green.posture)q.set('gposture',CFG.green.posture);
  q.set('cfg',encodeURIComponent(JSON.stringify(CFG)));
  return 'index.html?'+q.toString();
}
function sync(){
  const u=buildUrl();
  document.getElementById('urlBox').textContent=u;
  document.getElementById('urlBox').title=u;
  document.getElementById('goBtn').href=u;
  try{localStorage.setItem('canglan_cfg',JSON.stringify(CFG));}catch(e){}
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

(async function(){
  loadCfg();
  if(location.hash&&['red','blue','green'].includes(location.hash.slice(1)))CUR=location.hash.slice(1);
  try{
    const r=await fetch('data/L5_strategy_ops.json');
    if(r.ok){const j=await r.json(); PRESETS=j.presets;}
  }catch(e){}
  render(); sync();
  document.getElementById('saveBtn').onclick=()=>{
    try{localStorage.setItem('canglan_cfg',JSON.stringify(CFG));}catch(e){}
    document.getElementById('saveBtn').textContent='已保存 ✓';
    setTimeout(()=>document.getElementById('saveBtn').textContent='保存配置',1200);
  };
  if(location.hash){
    const el=document.getElementById('side-'+location.hash.slice(1));
    if(el)el.scrollIntoView({block:'center'});
  }
})();
</script>
</body>
</html>
