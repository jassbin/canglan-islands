<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>苍澜群岛 · 战略层</title>
<link rel="stylesheet" href="js/page.css">
<style>

:root { --ac: #4fc3d9; --ok: #57c46a; --bad: #e8786a; }
.sg-wrap { max-width: 1720px; margin: 0 auto; padding: 18px 22px 60px; }


.sg-posture { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 4px 0 14px; padding: 10px 14px; border: 1px solid var(--line);
  border-radius: 10px; background: linear-gradient(90deg, rgba(87,196,106,.07), transparent 70%); }
.sg-posture b { color: #c2f0c9; font-size: 13px; letter-spacing: .5px; }
.sg-posture .pp { padding: 6px 12px; border: 1px solid var(--line2); border-radius: 7px;
  font-size: 12.5px; cursor: pointer; color: #b6cbdb; background: rgba(10,24,36,.6); transition: .15s; }
.sg-posture .pp:hover { color: #eaf6ff; border-color: var(--ac); }
.sg-posture .pp.on { background: color-mix(in srgb, #57c46a 22%, transparent);
  border-color: #57c46a; color: #d8ffd9; box-shadow: 0 0 0 1px rgba(87,196,106,.25) inset; }
.sg-posture .pp small { display: block; opacity: .65; font-size: 10.5px; }
.sg-posture .pdesc { flex: 1 1 300px; font-size: 12px; color: #8fa8ba; line-height: 1.6; }


.sg-views { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.sg-views button { padding: 7px 16px; border: 1px solid var(--line2); border-radius: 8px;
  background: rgba(10,24,36,.6); color: #b6cbdb; font-size: 12.5px; cursor: pointer; transition: .15s; }
.sg-views button:hover { color: #eaf6ff; border-color: var(--ac); }
.sg-views button.on { background: color-mix(in srgb, var(--ac) 16%, transparent);
  border-color: var(--ac); color: #eaf6ff; font-weight: 600; }
.sg-views .vw-note { font-size: 11px; color: #6f899b; margin-left: auto; line-height: 1.5; }

.sg-layout { display: grid; grid-template-columns: 430px minmax(0,1fr); gap: 16px; align-items: start; }
@media (max-width: 1240px) { .sg-layout { grid-template-columns: 1fr; } }

.sg-layout.tvfull { grid-template-columns: minmax(0,1fr); }
.sg-layout.tvfull > #optCol { display: none; }
.sg-layout.tvfull.tv-opt > #optCol { display: block; position: fixed; left: 14px; top: 62px; bottom: 14px; width: 438px;
  overflow: auto; z-index: 55; background: rgba(10,20,32,.985); border: 1px solid var(--line2); border-radius: 12px;
  padding: 2px 12px 12px; box-shadow: 12px 0 40px rgba(0,0,0,.55); }
.sg-layout.tvfull.tv-opt > #optCol::before { content: '☰ 变量卡（点击右上「☰ 变量卡」收起）'; display: block;
  font-size: 11px; color: #7b93a6; padding: 8px 2px 4px; letter-spacing: .5px; }


.sg-sum { padding: 12px 14px; margin-bottom: 12px; }
.sg-sum h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: 1px; color: var(--ac); font-weight: 600; }
.sg-sum .row { display: flex; gap: 8px; font-size: 12px; padding: 4px 0; border-bottom: 1px dashed rgba(120,180,220,.12); }
.sg-sum .row:last-of-type { border: 0; }
.sg-sum .row i { color: #6f899b; font-style: normal; flex: 0 0 92px; }
.sg-sum .row span { color: #dceaf5; }
.sg-presets { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.sg-presets button { padding: 6px 11px; border: 1px solid var(--line2); border-radius: 7px;
  background: rgba(10,24,36,.6); color: #b6cbdb; font-size: 12px; cursor: pointer; transition: .15s; }
.sg-presets button:hover { border-color: var(--ac); color: #eaf6ff; }
.sg-presets button.on { border-color: var(--ac); background: color-mix(in srgb, var(--ac) 14%, transparent); color: #eaf6ff; }
.sg-conflict { margin-top: 10px; padding: 8px 10px; border: 1px solid rgba(232,120,106,.5);
  border-radius: 7px; background: rgba(232,120,106,.08); font-size: 11.5px; color: #ffc9c1; line-height: 1.7; }
.sg-conflict:empty { display: none; }
.sg-opp { margin-top: 10px; font-size: 11.5px; color: #8fa8ba; line-height: 1.8; }
.sg-opp .op-chip { display: inline-block; padding: 2px 8px; border-radius: 5px; margin: 0 3px;
  border: 1px solid var(--line2); background: rgba(10,24,36,.6); color: #cfe3f2; font-size: 11px; }
.sg-opp a { color: #6fa8c8; text-decoration: none; }


.sg-cat { padding: 12px 14px 10px; margin-bottom: 12px; }
.sg-cat h4 { margin: 0 0 2px; font-size: 13px; color: #cfe3f2; font-weight: 600; }
.sg-cat .hint { display: block; font-size: 11px; color: #7b93a6; margin-bottom: 10px; line-height: 1.55; }
.sg-item { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; margin-bottom: 8px;
  cursor: pointer; background: rgba(10,24,36,.5); transition: .15s; }
.sg-item:hover { border-color: var(--line2); background: rgba(20,42,60,.7); }
.sg-item.on { border-color: var(--ac); background: color-mix(in srgb, var(--ac) 12%, rgba(10,24,36,.6));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--ac) 35%, transparent) inset; }
.sg-item.bad { border-color: rgba(232,120,106,.55); }
.sg-item .t { display: flex; align-items: baseline; gap: 8px; }
.sg-item .t b { font-size: 13px; color: #e6f1fa; font-weight: 600; }
.sg-item .t em { margin-left: auto; font-style: normal; font-size: 10.5px; color: #6f899b; }
.sg-item .tl { font-size: 11.5px; color: #93aec2; margin: 4px 0 5px; line-height: 1.55; }
.effs { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0; }
.effs u { text-decoration: none; font-size: 10px; padding: 1px 6px; border-radius: 4px;
  font-family: Consolas, monospace; border: 1px solid var(--line); }
.effs u.pos { color: #8fe0a2; border-color: rgba(87,196,106,.4); }
.effs u.neg { color: #f0a49a; border-color: rgba(232,120,106,.4); }
.effs u.zro { color: #5f7d92; }
.reqw { font-size: 10.5px; color: #ffc861; margin: 3px 0; }
.sg-item ul { margin: 6px 0 0; padding: 0; list-style: none; }
.sg-item li { font-size: 11.5px; line-height: 1.6; color: #9fb6c8; padding-left: 14px; position: relative; }
.sg-item li.p::before { content: '＋'; position: absolute; left: 0; color: #6fcf97; }
.sg-item li.c::before { content: '－'; position: absolute; left: 0; color: #e8887a; }
.sg-item .src { margin-top: 6px; font-size: 10.5px; color: #5f7d92; line-height: 1.5; }
.sg-item .src a { color: #6fa8c8; text-decoration: none; border-bottom: 1px dotted rgba(111,168,200,.4); }
.sg-item.dim2 { opacity: .42; }
.sg-item.dim2 .t b { text-decoration: line-through; text-decoration-color: rgba(232,120,106,.6); }

.sg-item .t em .ft { font-style: normal; font-family: Consolas, monospace; font-weight: 700; color: #8fa8ba; }
.sg-item .t em .ft.hi { color: #7fd68f; }
.sg-item .t em .ft.lo { color: #c98a80; }
.sg-item.auto { border-style: dashed; }


.sg-rules { padding: 12px 14px; }
.sg-rules h4 { margin: 0 0 8px; font-size: 13px; color: #cfe3f2; }
.sg-rules .rl { font-size: 11.5px; line-height: 1.7; color: #93aec2; padding: 5px 0; border-bottom: 1px dashed rgba(120,180,220,.1); }
.sg-rules .rl:last-child { border: 0; }
.sg-rules .rl b { color: #d5e7f5; font-weight: 600; }
.sg-rules .rl .why { color: #7b93a6; }


.tk-wrap { padding: 16px 16px 20px; overflow-x: auto; }
.tk-wrap h3 { margin: 0 0 2px; font-size: 14px; color: var(--ac); letter-spacing: .5px; }
.tk-wrap .tsub { font-size: 11.5px; color: #7b93a6; line-height: 1.6; margin-bottom: 14px; }
.tk-flow { display: flex; gap: 0; align-items: stretch; min-width: 900px; }
.tk-col { flex: 1 1 0; min-width: 205px; display: flex; flex-direction: column; position: relative; padding-right: 26px; }
.tk-col::after { content: ''; position: absolute; right: 6px; top: 26px; width: 16px; height: 2px;
  background: linear-gradient(90deg, var(--ac), rgba(120,180,220,.15)); }
.tk-col:last-child { padding-right: 0; }
.tk-col:last-child::after { display: none; }
.tk-stage { border: 1.5px solid var(--ac); border-radius: 9px; padding: 8px 11px; background: rgba(10,24,36,.7); }
.tk-stage .num { display: inline-flex; width: 20px; height: 20px; border-radius: 50%; align-items: center;
  justify-content: center; background: var(--ac); color: #0b1a24; font-size: 11px; font-weight: 700; margin-right: 6px; }
.tk-stage b { font-size: 12.5px; color: #eaf6ff; }
.tk-stage .tm { display: block; font-size: 10px; color: #7b93a6; margin-top: 3px; font-family: Consolas, monospace; }
.tk-stage.ko { border-color: #ff9c6e; box-shadow: 0 0 0 1px rgba(255,156,110,.25) inset; }
.tk-stage .kob { float: right; font-size: 9.5px; padding: 1px 6px; border-radius: 8px;
  border: 1px solid rgba(201,138,94,.6); color: #c98a5e; }
.tk-stage .kob.on { background: #ff9c6e; border-color: #ff9c6e; color: #2a1408; font-weight: 700; }
.tk-route { font-size: 10.5px; color: #a9c2d6; line-height: 1.55; margin: 6px 2px 8px; padding: 6px 8px;
  border-left: 2px solid #57c46a; background: rgba(87,196,106,.07); border-radius: 0 6px 6px 0; }
.tk-route i { display: block; font-style: normal; font-size: 9.5px; color: #7fd68f; margin-bottom: 2px; letter-spacing: .5px; }
.tk-goal { font-size: 11px; color: #93aec2; line-height: 1.55; margin: 6px 2px; }
.tk-acts { margin: 0 0 6px; padding: 0 0 0 2px; list-style: none; }
.tk-acts li { font-size: 10.5px; color: #7d95a8; line-height: 1.5; padding-left: 10px; position: relative; }
.tk-acts li::before { content: '·'; position: absolute; left: 0; color: var(--ac); }
.tk-dp { border: 1px dashed rgba(255,200,97,.55); border-radius: 7px; padding: 6px 9px; margin: 2px 0 8px;
  background: rgba(255,200,97,.05); }
.tk-dp .dq { font-size: 11px; color: #ffc861; line-height: 1.5; }
.tk-dp .dc { font-size: 10px; color: #a08a5a; margin-top: 3px; line-height: 1.5; }
.tk-brs { display: flex; flex-direction: column; gap: 6px; }
.tk-br { border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; background: rgba(10,22,34,.55);
  cursor: pointer; transition: .15s; }
.tk-br.hit { border-color: rgba(87,196,106,.6); background: rgba(87,196,106,.09); }
.tk-br.dim { opacity: .38; }
.tk-br.open { border-style: dashed; }
.tk-br.term { background: transparent; }
.tk-br b { font-size: 11.5px; color: #cfe3f2; display: block; }
.tk-br.hit b { color: #d5f2da; }
.tk-br .whens { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.tk-br .whens u { text-decoration: none; font-size: 9.5px; padding: 1px 6px; border-radius: 4px;
  border: 1px solid rgba(120,180,220,.3); color: #8fb7d0; }
.tk-br.hit .whens u { border-color: rgba(87,196,106,.5); color: #9fd6a8; }
.tk-br .act { font-size: 10.5px; color: #93aec2; line-height: 1.55; margin-top: 4px; }
.tk-br .to { font-size: 10px; color: #6f899b; margin-top: 3px; }
.tk-br.hit .to { color: #7fd68f; }


.mx-wrap { padding: 16px 18px 20px; }
.mx-wrap h3 { margin: 0 0 2px; font-size: 14px; color: var(--ac); }
.mx-wrap .tsub { font-size: 11.5px; color: #7b93a6; line-height: 1.6; margin-bottom: 12px; }
table.mx { width: 100%; border-collapse: collapse; font-size: 11.5px; }
table.mx th { text-align: left; padding: 7px 9px; color: #8fb7d0; font-weight: 600; font-size: 11px;
  border-bottom: 1.5px solid var(--line2); letter-spacing: .5px; white-space: nowrap; }
table.mx td { padding: 8px 9px; border-bottom: 1px solid rgba(120,180,220,.1); vertical-align: top; color: #93aec2; line-height: 1.6; }
table.mx td.stg b { color: #dceaf5; display: block; font-size: 12px; }
table.mx td.stg small { color: #6f899b; font-family: Consolas, monospace; font-size: 10px; }
table.mx td.dp b { color: #ffc861; display: block; }
table.mx td.dp i { font-style: normal; color: #a08a5a; font-size: 10.5px; }
table.mx td .brow { display: flex; align-items: baseline; gap: 6px; padding: 2px 0; }
table.mx td .bdot { flex: none; width: 8px; height: 8px; border-radius: 2px; margin-top: 4px; }
.bd-hit { background: #57c46a; } .bd-dim { background: #6b4540; } .bd-open { background: transparent; border: 1px dashed #6f899b; }
table.mx td.to-c { font-family: Consolas, monospace; color: #7fd68f; white-space: nowrap; font-size: 11px; }


.ev-wrap { padding: 16px 18px 20px; }
.ev-wrap h3 { margin: 0 0 2px; font-size: 14px; color: var(--ac); }
.ev-wrap .tsub { font-size: 11.5px; color: #7b93a6; line-height: 1.6; margin-bottom: 14px; }
.ev-score { display: flex; align-items: baseline; gap: 14px; margin-bottom: 12px; flex-wrap: wrap; }
.ev-score .big { font-size: 40px; font-family: Consolas, monospace; font-weight: 700; color: #eaf6ff; }
.ev-score .lbl { font-size: 12px; color: #8fa8ba; }
.ev-bars { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 18px; margin-bottom: 16px; }
.ev-bar .bh { display: flex; justify-content: space-between; font-size: 11.5px; color: #a9c2d6; margin-bottom: 3px; }
.ev-bar .bh b { font-family: Consolas, monospace; }
.ev-bar .tr { height: 8px; border-radius: 4px; background: rgba(255,255,255,.07); overflow: hidden; }
.ev-bar .tr i { display: block; height: 100%; border-radius: 4px; background: var(--ac); transition: width .4s; }
.ev-env { font-size: 11.5px; color: #8fa8ba; line-height: 1.7; margin-bottom: 14px; padding: 8px 10px;
  border: 1px dashed rgba(120,180,220,.25); border-radius: 7px; }
table.ev-tb { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 8px; }
table.ev-tb th { text-align: left; padding: 6px 9px; color: #8fb7d0; border-bottom: 1.5px solid var(--line2); font-size: 11px; }
table.ev-tb td { padding: 7px 9px; border-bottom: 1px solid rgba(120,180,220,.1); color: #93aec2; }
table.ev-tb td.sc { font-family: Consolas, monospace; color: #eaf6ff; font-weight: 700; }
table.ev-tb tr.cur { background: color-mix(in srgb, var(--ac) 8%, transparent); }


.tv-wrap { padding: 12px 14px 20px; overflow: auto; }
.tv-wrap h3 { margin: 0 0 2px; font-size: 14px; color: var(--ac); }
.tv-wrap .tsub { font-size: 11.5px; color: #7b93a6; line-height: 1.6; margin-bottom: 10px; }
.tv-box { overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: rgba(6,14,22,.5); }
.tv-svg { display: block; margin: 0; }   
.tv-svg-m { margin: 0 auto; }            
.tv-svg .nd.stg-bar .n-rect { stroke: var(--ac); stroke-opacity: .55; fill: color-mix(in srgb, var(--ac) 9%, #0c1c2c); }   

.tv-blk { margin: 0 0 4px; }
.tv-blk-hd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 12.5px; color: #b6cbdb; margin: 2px 0 8px; padding-left: 2px; }
.tv-blk-hd b { color: #eaf6ff; font-size: 13.5px; letter-spacing: .5px; }
.tv-blk-hd i { font-style: normal; font-size: 10.5px; color: var(--ac); border: 1px solid rgba(79,195,217,.4);
  border-radius: 20px; padding: 1px 8px; }
.tv-blk-hd u { text-decoration: none; font-size: 11px; color: #6f899b; }
.tv-blk-hd .ko-sum { margin-left: auto; color: #ff9c6e; font-size: 11.5px; }

.tv-sub { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; margin: 14px auto 4px; padding: 11px 14px 0;
  border-top: 1px dashed rgba(120,180,220,.28); max-width: 1210px; }
.tv-sub b { color: #8fd3e6; font-size: 12.5px; letter-spacing: .5px; }
.tv-sub span { color: #6f899b; font-size: 11px; }
.tv-sub em { margin-left: auto; font-style: normal; font-size: 11px; color: #8fa8ba; }
.tv-link { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; padding: 9px 12px;
  border: 1px dashed rgba(120,180,220,.3); border-radius: 10px; background: rgba(10,24,36,.55); }
.tv-link .lk-cap { font-size: 10.5px; color: #7b93a6; letter-spacing: .6px; }
.tv-link .lk-chip { font-size: 11px; color: #8fa8ba; padding: 3px 8px; border-radius: 6px;
  background: rgba(79,195,217,.07); border: 1px solid rgba(79,195,217,.16); }
.tv-link .lk-chip b { color: #d5e7f5; font-weight: 600; }
.tv-link .lk-sep { color: #46617a; font-size: 11px; }
.tv-link .lk-go { margin-left: auto; font-size: 11px; color: #7fd68f; white-space: nowrap; }
.tv-svg .nd { cursor: pointer; }
.tv-svg .nd text { font-family: inherit; }
.tv-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: #7b93a6; margin-top: 10px; line-height: 1.6; }
.tv-legend i { font-style: normal; }

.tv-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 2px; }
.tv-top h3 { margin: 0; }
.tv-tools { margin-left: auto; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.tv-tools .tv-tl { font-size: 10.5px; color: #7b93a6; letter-spacing: 1px; }
.tv-pre { padding: 4px 11px; border-radius: 7px; cursor: pointer; font-size: 11.5px;
  border: 1px solid var(--line2); background: rgba(255,255,255,.04); color: #a9c2d6; }
.tv-pre:hover { border-color: var(--ac); color: #eaf6ff; }
.tv-optbtn { padding: 4px 12px; border-radius: 7px; cursor: pointer; font-size: 11.5px;
  border: 1px solid var(--ac); background: color-mix(in srgb, var(--ac) 12%, transparent); color: #eaf6ff; }

.tv-detail { position: fixed; right: 14px; top: 62px; bottom: 14px; width: 400px; z-index: 60;
  background: rgba(12,24,36,.98); border: 1px solid var(--line2); border-radius: 12px;
  box-shadow: -10px 0 36px rgba(0,0,0,.55); padding: 15px 17px; overflow-y: auto; display: none; }
.tv-detail.on { display: block; }
.tv-detail .dh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.tv-detail .dh b { font-size: 15px; color: #eaf6ff; line-height: 1.4; }
.tv-detail .dh .x { margin-left: auto; cursor: pointer; color: #6f899b; font-size: 16px; padding: 2px 6px; }
.tv-detail .dh .x:hover { color: #eaf6ff; }
.tv-detail .knd { font-size: 10px; padding: 2px 8px; border-radius: 4px; letter-spacing: 1px; }
.tv-detail .sec { font-size: 12px; color: #93aec2; line-height: 1.7; margin: 8px 0; }
.tv-detail .sec b { color: #d5e7f5; }
.tv-detail .pick { display: block; width: 100%; margin-top: 12px; padding: 9px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--ac); background: color-mix(in srgb, var(--ac) 14%, transparent); color: #eaf6ff; font-size: 13px; }
.tv-detail .pick:hover { background: color-mix(in srgb, var(--ac) 26%, transparent); }
.tv-detail .pick.off { border-color: var(--line2); background: transparent; color: #93aec2; }

.tv-svg .n-rect { fill: #0c1c2c; stroke: #35506a; stroke-width: 1.2; }
.tv-svg .nd { transition: opacity .15s; }
.tv-svg .nd:hover .n-rect { stroke: #7fa8c4; stroke-width: 2; }
.tv-svg .nd.sel .n-rect { stroke: var(--ac); stroke-width: 2.4; fill: var(--ac); fill-opacity: .14; }
.tv-svg .nd.hi-to .n-rect { stroke: #7fd68f; stroke-width: 2.4; fill: rgba(87,196,106,.1); }   
.tv-svg .nd.sel .n-t { fill: #eaf6ff; }
.tv-svg .nd.dim { opacity: .38; }
.tv-svg .nd.dim .n-rect { stroke-dasharray: 4 3; }
.tv-svg .nd.air-cur .n-rect { stroke: #ffc861; stroke-width: 2.2; fill: #ffc861; fill-opacity: .1; }
.tv-svg .nd.air-cur .n-t { fill: #ffe2a8; }
.tv-svg .nd.sea-cur .n-rect { stroke: #5ec8c0; stroke-width: 2.2; fill: #5ec8c0; fill-opacity: .1; }
.tv-svg .nd.sea-cur .n-t { fill: #b8ece6; }
.tv-svg .nd.auto .n-rect { stroke-dasharray: 6 2; }
.tv-svg .n-fit { font-size: 10.5px; font-family: Consolas, monospace; fill: #6f899b; font-weight: 700; }
.tv-svg .n-fit.hi { fill: #7fd68f; }
.tv-svg .n-fit.lo { fill: #c98a80; }
.tv-svg .nd.ly-n .n-rect { stroke: #b98ce0; stroke-width: 2; fill: #b98ce0; fill-opacity: .1; }
.tv-svg .nd.stg .n-rect { stroke: var(--ac); stroke-width: 2; }
.tv-svg .nd.stg .n-t { fill: #eaf6ff; }

<div id="navSlot"></div>
<div class="sg-wrap">
  <div class="page-head">
    <h1>战略层 · 多预案决策树</h1>
    <span class="ph-sub" id="phSub">战略层＝<b>两张图一条链</b>：<b style="color:#8fd3e6">图A 战前 · 决策收敛</b>（影响图语法 □我方决策 ∥ ○外部不确定 → ◇派生态势；敲定任一项，下游「可行 N/M」实时收窄——淘汰树）→ <b style="color:#7fd68f">图B 战时 · 执行应变</b>（同步矩阵：列＝阶段、行＝作战线；◆＝阶段判断门；⚠受阻＝branch 改走、⚡突变＝介入/政治、▸应对→sequel 转段）。方法论：影响图（决策分析）· MDMP 同步矩阵/DST（JP 5-0）· branches &amp; sequels · 情景规划研判外部不确定</span>
    <span class="ph-sp"></span>
    <a href="tactical.html?side=red" id="tcLink" style="font-size:12px;color:var(--ac);text-decoration:none;border:1px solid var(--ac);border-radius:12px;padding:2px 12px;white-space:nowrap" title="战术层：任务编组 + H-Hour 作战序列 + OPORD 五段式（阶段卡 r1-r5/b1-b4 的时刻表细化）">⊖ 战术序列 ↗</a>
    <a href="preset.html?side=red" id="cfgLink" style="font-size:12px;color:#7fdcff;text-decoration:none;border:1px solid rgba(120,180,220,.5);border-radius:12px;padding:2px 12px;white-space:nowrap" title="战前配置台：把本页选定的战略+分支走向存成本地配置，战场页战略台「⚙ 自定义方案」整套应用">⚙ 战前配置 ↗</a>
    <div class="ph-tabs" id="sideTabs"></div>
  </div>

  <div class="sg-posture" id="postureBar"></div>

  
  <div class="sg-mystrat" id="myStratBar"></div>

  <div class="sg-views" id="viewBar"></div>

    <aside id="optCol"></aside>
    <main id="mainCol"></main>
  </div>

<script type="module">
const __hbOff=()=>Promise.resolve({ok:false,status:0,json:()=>Promise.resolve(null),text:()=>Promise.resolve('')});

import { nav, S, esc, initTips } from './js/theme.js';
import * as MS from './js/mystrat.js';   
window.addEventListener('error', ev => { document.title = 'ERR|' + ev.message + '@' + (ev.lineno || ''); });

const qs = new URLSearchParams(location.search);
const _sv = qs.get('side');
const side = _sv === 'blue' ? 'blue' : _sv === 'green' ? 'green' : 'red';
const sd = S(side);
document.getElementById('navSlot').outerHTML = nav('strategy', side);
document.body.style.setProperty('--ac', sd.color);
document.title = '苍澜群岛 · 战略层 · ' + sd.cn + ' [v0.4]';
initTips();


document.getElementById('tcLink').href = 'tactical.html?side=' + side;
document.getElementById('cfgLink').href = 'preset.html?side=' + side;

document.getElementById('sideTabs').innerHTML =  `<button data-s="red" class="${side === 'red' ? 'on' : ''}">◆ 红方·大陆</button>` +
  `<button data-s="blue" class="${side === 'blue' ? 'on' : ''}">▲ 蓝方·岛内</button>` +
  `<button data-s="green" class="${side === 'green' ? 'on' : ''}">● 绿方·美军</button>`;
document.querySelectorAll('#sideTabs button').forEach(b => {
  b.onclick = () => { location.href = 'strategy.html?side=' + b.dataset.s; };
});

const DATA = await (await fetch('data/L5_strategy_ops.json?v=' + Date.now())).json();
const SIDES = DATA.sides;
const sd5 = SIDES[side];
const CRIT_N = {}; DATA.crits.forEach(c => CRIT_N[c.id] = c.n);


const LS_P = 'sg_posture_v1', LS_S = 'sg_sel_v3', LS_A = 'sg_auto_v2', LS_M = 'sg_man_v2';
let posture = localStorage.getItem(LS_P) || 'limited';
let selAll = {}, autoAll = {}, manAll = {};
try { selAll = JSON.parse(localStorage.getItem(LS_S) || '{}'); } catch { selAll = {}; }
try { autoAll = JSON.parse(localStorage.getItem(LS_A) || '{}'); } catch { autoAll = {}; }
try { manAll = JSON.parse(localStorage.getItem(LS_M) || '{}'); } catch { manAll = {}; }
for (const k of ['red', 'blue', 'green']) { selAll[k] = selAll[k] || {}; autoAll[k] = autoAll[k] || {}; manAll[k] = manAll[k] || {}; }

if (!localStorage.getItem(LS_M)) {
  for (const k of ['red', 'blue', 'green']) for (const c of SIDES[k].vars) if (selAll[k][c.id]) manAll[k][c.id] = 1;
}
function saveState() {
  localStorage.setItem(LS_S, JSON.stringify(selAll));
  localStorage.setItem(LS_A, JSON.stringify(autoAll));
  localStorage.setItem(LS_M, JSON.stringify(manAll));
}
let view = qs.get('view') || 'tree';

function _tryPreset(sd, pid) {
  const pr = ((DATA.presets[sd]) || []).find(p => p.id === pid);
  if (pr) {
    for (const c of SIDES[sd].vars) { selAll[sd][c.id] = pr.sel[c.id] ?? null; manAll[sd][c.id] = pr.sel[c.id] ? 1 : 0; }
  }
}
if (qs.get('preset')) _tryPreset(side, qs.get('preset'));
if (qs.get('opp')) { const [os, op] = qs.get('opp').split(':'); if (SIDES[os]) _tryPreset(os, op); }
if (DATA.green_posture.some(p => p.id === qs.get('posture'))) posture = qs.get('posture');

const OPP = { red: 'blue', blue: 'red', green: 'red' };   


function valOf(key, forSide) {          
  if (key === 'posture') return posture;
  if (key === 'air') return calcAir();
  if (key === 'sea') return calcSea();
  const s = varSide(key) || forSide;
  return selAll[s][key] ?? null;
}
function branchState(b, forSide) {      
  let decided = false;
  for (const k in b.when) {
    const cur = valOf(k, forSide);
    if (cur == null) continue;          
    decided = true;
    if (!b.when[k].includes(cur)) return { st: 'dim', failKey: k, failVal: cur };
  }
  return { st: decided ? 'hit' : 'open' };
}


function stageView(ph) {
  if (!ph || !ph.alt) return ph;
  if (branchState(ph.alt, side).st !== 'hit') return ph;
  const v = Object.assign({}, ph);
  v.n = ph.alt.n || ph.n; v.goal = ph.alt.goal || ph.goal;
  v.route = ph.alt.route; v.routes = null; v.acts = ph.alt.acts || ph.acts; v.__alt = 1;
  return v;
}
function reqFail(item, forSide) {       
  for (const k in (item.req || {})) {
    const cur = valOf(k, forSide);
    if (cur != null && !item.req[k].includes(cur)) return { key: k, val: cur };
  }
  return null;
}

function crossConflict(forSide) {
  const s = selAll;
  if (forSide === 'red' && s.red.deny === 'dn_firststrike' && s.green.gposture === 'gp_forward')
    return '「先制打击前沿」与绿方「前沿重兵」对冲：红方政治代价大增，绿方 spd/surv 双降';
  if (forSide === 'green' && s.red.deny === 'dn_firststrike' && s.green.gposture === 'gp_forward')
    return '红方「先制打击前沿」与我方「前沿重兵」对冲：前沿阵地首波互毁';
  return null;
}
function conflicts(forSide) {
  const out = [], own = selAll[forSide];
  for (const cat of SIDES[forSide].vars) {
    const it = cat.items.find(x => x.id === own[cat.id]);
    if (!it) continue;
    const f = reqFail(it, forSide);
    if (f) {
      const catN = SIDES[forSide].vars.find(c => c.items.includes(it)).n;
      const reqTxt = Object.entries(it.req).map(([k, v]) => CRIT_VAR_N(k) + ' ∈ {' + v.map(idName).join('/') + '}').join(' 且 ');
      out.push(`「${it.n}」要求 ${reqTxt}；当前 ${CRIT_VAR_N(f.key)} = ${idName(f.val) || '未定'}`);
    }
  }
  const cc = crossConflict(forSide);
  if (cc) out.push(cc);
  return out;
}
function CRIT_VAR_N(key) {
  if (key === 'posture') return '绿方介入深度';
  for (const s of Object.values(SIDES)) for (const c of s.vars) if (c.id === key) return c.n;
  return key;
}
function idName(id) {
  if (!id) return '';
  for (const s of Object.values(SIDES)) for (const c of s.vars) { const it = c.items.find(x => x.id === id); if (it) return it.n; }
  const p = DATA.green_posture.find(p => p.id === id); if (p) return p.n;
  return id;
}


function scoreSide(forSide) {
  const raw = { spd: 0, surv: 0, pol: 0, rev: 0, syn: 0 };
  const det = [];
  const add = (eff, src) => { if (!eff) return; det.push({ n: src, eff }); for (const k in eff) raw[k] += eff[k] || 0; };
  const own = selAll[forSide];
  for (const cat of SIDES[forSide].vars) {
    const it = cat.items.find(x => x.id === own[cat.id]);
    add(it && it.eff, it ? it.n : null);
  }
  const p = DATA.green_posture.find(x => x.id === posture);
  add(p && p.eff[forSide], '环境：' + p.n);
  const w = DATA.weights[forSide];
  const per = {}; let total = 0;
  for (const c of DATA.crits) {
    per[c.id] = Math.max(5, Math.min(95, 50 + raw[c.id] * 12));
    total += per[c.id] * w[c.id];
  }
  const cf = conflicts(forSide);
  total = Math.max(0, Math.min(100, total - cf.length * 8));
  return { raw, per, total, det, cf };
}


function renderPosture() {
  const bar = document.getElementById('postureBar');
  const cur = DATA.green_posture.find(p => p.id === posture) || DATA.green_posture[0];
  bar.innerHTML = `<b>全局条件 · 绿方介入深度</b>` +
    DATA.green_posture.map(p => `<div class="pp ${p.id === posture ? 'on' : ''}" data-p="${p.id}">
      ${esc(p.n)}<small>${esc(p.sub)}</small></div>`).join('') +
    `<div class="pdesc">${esc(cur.desc)}${cur.src ? ' <a href="' + esc(cur.src[0].url) + '" target="_blank" rel="noopener" style="color:#6fa8c8">来源</a>' : ''}</div>`;
  bar.querySelectorAll('.pp').forEach(el => {
    el.onclick = () => {
      posture = el.dataset.p; localStorage.setItem(LS_P, posture);
      for (const s of ['red', 'blue', 'green']) autoFill(s);   
      saveState(); renderAll();
    };
  });
}


function renderViews() {
  const bar = document.getElementById('viewBar');
  const VIEWS = [
    ['tree', '❋ 交互决策树', '因果链 → 主干 → 意外分支，一整棵树；点击节点看详情/选值'],
    ['trunk', '◉ 决策树主干', '阶段主干 + 决策点 + 分支；激活/排除随变量联动'],
    ['matrix', '▦ 决策支持矩阵', 'DSM：决策点 / 判据 / 备选动作 / 转段（FM 101-5-1 产物）'],
    ['eval', '◈ 组合评估', 'COA 对比：五维评分 + 预案对比 + 冲突清单'],
  ];
  bar.innerHTML = VIEWS.map(([v, n, d]) =>
    `<button class="${view === v ? 'on' : ''}" data-v="${v}">${n}</button>`).join('') +
    `<span class="vw-note">${esc((VIEWS.find(x => x[0] === view) || [])[2] || '')}</span>`;
  bar.querySelectorAll('button').forEach(b => { b.onclick = () => { view = b.dataset.v; renderViews(); renderMain(); }; });
}


function effHtml(eff) {
  if (!eff) return '';
  return `<div class="effs">` + Object.entries(eff).filter(([, v]) => v).map(([k, v]) =>
    `<u class="${v > 0 ? 'pos' : 'neg'}">${CRIT_N[k]}${v > 0 ? '+' : ''}${v}</u>`).join('') + `</div>`;
}
function renderOpts() {
  const col = document.getElementById('optCol');
  const own = selAll[side];
  const sc = scoreSide(side);
  const sum = sd5.vars.map(c => {
    const it = c.items.find(x => x.id === own[c.id]);
    const au = autoAll[side][c.id] && it;
    return `<div class="row"><i>${esc(c.n)}</i><span>${it ? (au ? '⟳ ' : '') + esc(it.n) : '未选'}</span></div>`;
  }).join('');
  const pres = DATA.presets[side] || [];
  const curPreset = pres.find(p => Object.entries(p.sel).every(([k, v]) => own[k] === v) &&
    Object.values(own).filter(Boolean).length === Object.keys(p.sel).length);
  const cfHtml = sc.cf.length ? `<div class="sg-conflict">⚠ 联动冲突：${sc.cf.map(c => esc(c)).join('；')}</div>` : '';
  const oppKey = OPP[side];
  const oppChips = SIDES[oppKey].vars.map(c => {
    const v = selAll[oppKey][c.id];
    return `<span class="op-chip" title="跨页共享：在 ${esc(SIDES[oppKey].cn)} 页可修改">${esc(c.n)}：${v ? esc(idName(v)) : '未定'}</span>`;
  }).join('');
  col.innerHTML =
    `<section class="panel-x sg-sum"><h3>战略组合 · ${esc(sd5.cn)}</h3>${sum}
       <div style="font-size:11.5px;color:#7b93a6;line-height:1.65;margin-top:8px">${esc(sd5.intent)}</div>
       ${pres.length ? `<div class="sg-presets">多预案：` + pres.map((p, i) =>
         `<button data-p="${i}" class="${curPreset && curPreset.id === p.id ? 'on' : ''}" title="${esc(p.desc)}">${esc(p.n)}</button>`).join('') + `</div>` : ''}
       ${cfHtml}
       <div class="sg-opp">联动引用 · ${esc(SIDES[oppKey].cn)}设定（分支条件可直接引用）：${oppChips}
         <a href="strategy.html?side=${oppKey}">去设定 ↗</a></div>
     </section>` +
    sd5.vars.map(c => `<section class="panel-x sg-cat">
      <h4>${esc(c.n)}</h4><span class="hint">${esc(c.hint || '')}</span>
      ${c.items.map(it => {
        const bad = !!reqFail(it, side);
        const flt = filterFor(c.id);
        const dimd = flt.excluded.has(it.id);
        const f = it.fit ? fitScore(it, side) : null;
        const isAuto = !!autoAll[side][c.id] && own[c.id] === it.id;
        return `<div class="sg-item ${own[c.id] === it.id ? 'on' : ''} ${isAuto ? 'auto' : ''} ${bad ? 'bad' : ''} ${dimd ? 'dim2' : ''}" data-cat="${c.id}" data-id="${it.id}" title="${bad ? '前置条件未满足' : dimd ? '被级联筛选排除：' + (flt.whys[it.id] || '') : ''}">
        <div class="t"><b>${isAuto ? '⟳ ' : ''}${esc(it.n)}</b><em>${f ? `<u class="ft ${f.score >= 68 ? 'hi' : f.score <= 34 ? 'lo' : ''}">${f.score}</u> · ` : ''}置信 ${esc(it.conf || '—')}</em></div>
        <div class="tl">${esc(it.tl || '')}</div>
        ${dimd ? `<div class="reqw" style="color:#e8a49a">⚠ 筛选：${esc(flt.whys[it.id] || '')}</div>` : ''}
        ${effHtml(it.eff)}
        ${bad ? `<div class="reqw">⚠ 前置：${Object.entries(it.req).map(([k, v]) => esc(CRIT_VAR_N(k)) + ' ∈ {' + v.map(x => esc(idName(x))).join('/') + '}').join('，')}</div>` : ''}
        ${(own[c.id] === it.id && (it.pros.length || it.cons.length)) ? `<ul>${it.pros.map(p => `<li class="p">${esc(p)}</li>`).join('')}${it.cons.map(p => `<li class="c">${esc(p)}</li>`).join('')}</ul>` : ''}

function curVal(k) {
  if (k === 'posture') return posture;
  if (k === 'air') return calcAir();
  if (k === 'sea') return calcSea();
  const s = varSide(k);
  return s ? (selAll[s][k] ?? null) : null;
}

function derivedOut(kind, pOverride) {
  const D = V3[kind];
  if (!D || !D.base) return null;
  let i = D.base[pOverride || posture] ?? 1;
  for (const m of (D.mods || [])) {
    for (const k in m.when) {
      const cur = (k === 'air' ? calcAir() : k === 'sea' ? calcSea() : curVal(k));
      if (cur != null && m.when[k].includes(cur)) i += m.d;
    }
  }
  return D.lv[Math.max(0, Math.min(D.lv.length - 1, i))].id;
}
function calcAir() { return derivedOut('air'); }
function calcSea() { return derivedOut('sea'); }

function fitScore(item, forSide) {
  const notes = []; let s = 0;
  for (const [k, tbl] of Object.entries(item.fit || {})) {
    let cur;
    if (k === 'posture') cur = posture;
    else if (k === 'air') cur = calcAir();
    else if (k === 'sea') cur = calcSea();
    else { const vs = varSide(k); cur = vs ? (selAll[vs][k] ?? null) : null; }
    if (cur == null) continue;
    const d = tbl[cur];
    if (d === undefined) continue;
    s += d;
    if (d) notes.push([k, cur, d]);
  }
  return { score: Math.max(5, Math.min(95, Math.round(50 + 13 * s))), notes };
}
function varSide(key) { for (const s in SIDES) if (SIDES[s].vars.some(c => c.id === key)) return s; return null; }

function bestVal(varId, forSide) {
  const cat = SIDES[forSide].vars.find(c => c.id === varId);
  if (!cat) return null;
  const flt = filterFor(varId, forSide);
  let best = null, bs = -1e9;
  for (const it of cat.items) {
    if (flt.excluded.has(it.id)) continue;             
    if (reqFail(it, forSide)) continue;                
    const sc = fitScore(it, forSide).score;
    if (sc > bs) { bs = sc; best = it.id; }
  }
  if (!best) {                                          
    const fb = cat.items.find(it => !flt.excluded.has(it.id) && !reqFail(it, forSide)) || cat.items[0];
    best = fb.id;
  }
  return best || cat.items[0].id;
}
function autoFill(forSide) {
  
  const seq = (V3.autoseq && V3.autoseq[forSide]) || (V3.chains[forSide] || []).map(c => c.var).filter(Boolean);
  const seen = new Set();
  for (const v of seq) {
    if (seen.has(v) || ['posture', 'air', 'sea', 'airsea'].includes(v)) continue;
    seen.add(v);
    if (manAll[forSide][v]) continue;                  
    const b = bestVal(v, forSide);
    if (b) { selAll[forSide][v] = b; autoAll[forSide][v] = 1; }
  }
}
function filterFor(varId, forSide) {       
  const fs = forSide || side;
  const out = { excluded: new Set(), whys: {} };
  const curAir = calcAir(), curSea = calcSea();
  for (const f of V3.filters) {
    if (f.var !== varId || !f.when) continue;
    let hit = true;
    for (const k in f.when) {
      let cur;
      if (k === 'posture') cur = posture;
      else if (k === 'air') cur = curAir;
      else if (k === 'sea') cur = curSea;
      else cur = selAll[varSide(k) || fs][k] ?? null;
      if (cur == null || !f.when[k].includes(cur)) { hit = false; break; }
    }
    if (!hit) continue;
    const apply = (id) => { out.excluded.add(id); out.whys[id] = f.why; };
    const cat = SIDES[fs].vars.find(c => c.id === varId);
    if (f.only && cat) { for (const it of cat.items) if (!f.only.includes(it.id)) apply(it.id); }
    if (f.exclude) f.exclude.forEach(apply);
  }
  return out;
}
function allowVia(fromVar, fromVal, toVar, toVal) {   
  for (const f of V3.filters) {
    if (f.var !== toVar || !f.when || !f.when[fromVar]) continue;
    if (!f.when[fromVar].includes(fromVal)) continue;
    if (f.only && !f.only.includes(toVal)) return false;
    if (f.exclude && f.exclude.includes(toVal)) return false;
  }
  return true;
}
function trigState(c0) {           
  const w = (c0.trigger || {}).when || {};
  let decided = false;
  for (const k in w) {
    const cur = curVal(k);
    if (cur == null) continue;
    decided = true;
    if (!w[k].includes(cur)) return 'far';
  }
  return decided ? 'armed' : 'open';
}

const TV = { sel: null };
const cut = (s, m) => (!s || s.length <= m) ? (s || '') : s.slice(0, m) + '…';

function wrapText(s, maxW, fs) {
  const out = []; let line = '', w = 0;
  for (const ch of (s || '')) {
    const cw = /[\x00-\xff]/.test(ch) ? fs * 0.56 : fs;
    if (w + cw > maxW && line) { out.push(line); line = ''; w = 0; }
    line += ch; w += cw;
  }
  if (line) out.push(line);
  return out;
}

function splitTag(t, maxW) {
  if (!t) return [];
  const i = t.indexOf('（');
  if (i > 0) return [t.slice(0, i), t.slice(i)];

}

function renderTree() {
  const col = document.getElementById('mainCol');
  const chain = (V3.chains[side] || []).filter(c => c.kind !== 'stages');
  if (!chain.length) { col.innerHTML = '<section class="panel-x tk-wrap"><h3>交互决策树</h3><div class="tsub">本方暂无因果链数据</div></section>'; return; }
  const stages = sd5.trunk;
  const conts = V3.contingencies[side] || [];
  const curAir = calcAir(), curSea = calcSea();
  const own = selAll[side];

  
  const PAD = 16;
  const CW = 168, LGAP = 34, PAR_GAP = 64, VH = 42, VG = 10, NY0 = 84;
  const BX = 7, BT = 24, BB = 8;          
  const ASH = 228;                       

  
  const cols = []; const NDMAP = {};
  for (const c of chain) {
    let nodes = [], varId = c.var || '', label = '';
    if (c.var === 'posture') {
      label = '全局 · 绿方介入深度';
      nodes = DATA.green_posture.map(p => ({ id: 'p:' + p.id, kind: 'val', varId: 'posture', val: p.id, n: p.n, sub: p.sub, it: p }));
    } else if (c.var === 'airsea') {
      
      label = '空海态势（派生）';
      nodes = [{ id: 'as', kind: 'asn', varId: 'airsea', n: '空海态势', sub: '制空 / 制海', h: ASH }];
    } else if (c.var === 'air' || c.var === 'sea') {
      const D = V3[c.var], isAir = c.var === 'air';
      label = isAir ? '制空评估（派生）' : '制海评估（派生）';
      nodes = D.lv.map(v => ({ id: (isAir ? 'a:' : 'e:') + v.id, kind: isAir ? 'airv' : 'seav',
        varId: c.var, val: v.id, n: v.n, sub: v.tl, it: v })).reverse();   
    } else if (c.kind === 'layout') {
      label = '战役布局（收敛）';
      nodes = [{ id: 'ly', kind: 'ly', n: '布局要点', sub: '点击查看当前收敛结果' }];
    } else {
      const cat = sd5.vars.find(v => v.id === c.var);
      label = cat.n; varId = c.var;
      const flt = filterFor(c.var);
      nodes = cat.items.map(it => ({ id: 'v:' + c.var + ':' + it.id, kind: 'val', varId: c.var, val: it.id, n: it.n, sub: cut(it.tl, 17), it, dim: flt.excluded.has(it.id), why: flt.whys[it.id] }));
    }
    cols.push({ c, varId, label, nodes });
  }

  
  const groups = [];
  for (const c0 of cols) {
    const lv = c0.c.lvl ?? 0;
    let g = groups[groups.length - 1];
    if (!g || g.lvl !== lv) { g = { lvl: lv, n: c0.c.lvlN || '', tag: c0.c.lvlTag || '', cols: [] }; groups.push(g); }
    g.cols.push(c0);
  }
  const chainW = groups.length * CW + (groups.length - 1) * LGAP;
  const W = chainW + PAD * 2;                          
  const chainX0 = Math.round((W - chainW) / 2);

        NDMAP[nid] = { id: nid, kind: 'rtcell', lane: mainLane, legI: legI0, stgI: ci, txt: r.t.join('；'), txts: r.t, x, y: spineY, w: LGW, h: SP_H };
        const kb = legsOf[ci].some(o => (mainLane.key || {})[o.i]), hb = legsOf[ci].some(o => (mainLane.hard || {})[o.i]);

    const forkY = spineY + SP_H + 24;

            const toS = t.to === '-' ? '终局' : ((stages.find(s => s.id === t.to) || {}).n || '—');

    let brBot = forkY + stripH;
    brLanes.forEach(l => {

      const occCi = stages.map((ph, ci) => ({ ci, on: rows[ci].t.length })).filter(o => o.on);

      gM.push(`<g class="nd rt-lane" data-n="rt:lane:${l.id}">

      stages.forEach((ph, ci) => {

        NDMAP[nid] = { id: nid, kind: 'rtcell', lane: l, legI: legI0, stgI: ci, txt: r.t.join('；'), txts: r.t, x, y: by, w: LGW, h: BH };
        const kb = legsOf[ci].some(o => (l.key || {})[o.i]), hb = legsOf[ci].some(o => (l.hard || {})[o.i]);

          <rect class="n-rect" x="${x}" y="${by}" width="${LGW}" height="${BH}" rx="7" style="stroke:${col};stroke-opacity:${l.dash ? .5 : .7};stroke-width:1.2;${l.dash ? 'stroke-dasharray:5 4;' : ''}fill:${col};fill-opacity:.05"/>
          ${kb ? cellBadge(x + LGW - (hb ? 36 : 16), by, '#ffd76a', '★', '★ 重点环节') : ''}${hb ? cellBadge(x + LGW - 16, by, '#ff7a7a', '⛰', '⛰ 难点环节') : ''}
          ${r.t.map((t, k) => `<text class="rt-t" x="${x + 9}" y="${by + 18 + k * 13}">${esc(cut(t, 19))}</text>`).join('')}</g>`);

        const ci = occCi[occCi.length - 1].ci, ex = cellX(ci) + LGW - 4, ey = by + BH;
        gM.push(`<g><title>${esc(l.end)}</title>

    });

    if (mainLane) NDMAP['rt:lane:' + mainLane.id] = { id: 'rt:lane:' + mainLane.id, kind: 'rtlane', lane: mainLane };

    const HM = brBot + (brLanes.length ? 16 : 14);
    svgM = `<svg class="tv-svg tv-svg-m" width="${RTW}" height="${HM}" viewBox="0 0 ${RTW} ${HM}">
      <defs>
        <marker id="arwA" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--ac)"/></marker>
        <marker id="arwD" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7b93a6"/></marker>
      </defs>
      ${edgesM.join('')}${gM.join('')}
    </svg>`;
  }

  
  const chipOf = (c0) => {
    let v = '';
    if (c0.c.kind === 'layout') return '';
    if (c0.varId === 'posture') v = (DATA.green_posture.find(p => p.id === posture) || {}).n || '未定';
    else if (c0.varId === 'airsea') v = (V3.air.lv.find(x => x.id === curAir) || {}).n + ' / ' + (V3.sea.lv.find(x => x.id === curSea) || {}).n;
    else v = idName(own[c0.varId]) || '未定';
    return `<span class="lk-chip">${esc(c0.c.tag || c0.label)} <b>${esc(v)}</b></span>`;
  };
  const chips = cols.map(chipOf).filter(Boolean).join('<span class="lk-sep">›</span>');

  const chosen = sd5.vars.map(c0 => { const it = c0.items.find(v => v.id === own[c0.id]); return it ? it.n : null; }).filter(Boolean);
  const pres = DATA.presets[side] || [];
  const cfN = scoreSide(side).cf.length;
  col.innerHTML = `<section class="panel-x tv-wrap">
    <div class="tv-top">
      <h3>交互决策树 · ${esc(sd5.cn)}</h3>
      <div class="tv-tools">
        <span class="tv-tl">多预案</span>
        ${pres.map((p, i) => `<button class="tv-pre" data-p="${i}" title="${esc(p.desc)}">${esc(p.n)}</button>`).join('')}
        <button class="tv-optbtn" id="tvOptBtn" title="变量卡、对手设定、联动规则（可在此直接改选）">☰ 变量卡</button>
      </div>
    </div>
    <div class="tsub">${chosen.length ? '当前路径：<b style="color:#d5e7f5">' + esc(chosen.join(' ＋ ')) + '</b>（亮色 = 主链）'
      : '点击树上任意值节点选宏观变量（或上方预案一键载入），整棵树随之联动'}　｜　选定后下游自动取<b>匹配度最高</b>的候选（节点右上角数字），可手选覆盖${cfN ? `　｜　<span style="color:#e8a49a">⚠ 联动冲突 ${cfN} 条</span>` : ''}</div>
    ${(V3.assess || {})[side] ? `<div class="tsub" style="color:#6f899b;margin:-4px 0 10px">${esc(V3.assess[side])}</div>` : ''}
    <div class="tv-blk">
      <div class="tv-blk-hd"><b>① 战前 · 决策收敛</b><i>影响图 · 淘汰树</i><u>节点语法：<b style="color:#57c46a">□ 我方决策</b>（点击选值）∥ <b style="color:#ff9c6e">○ 外部不确定</b>（只能研判）→ <b style="color:#ffd76a">◇ 派生/收敛</b>（上游决定）。同层并行项<b style="color:#7fd68f">上下堆叠</b>、跨层才联动；列头右上「可行 N/M」＝上游敲定后本列剩余候选（灰化＝被联动淘汰，悬停看原因）</u></div>
      <div class="tv-box">${svgA}</div>
    </div>
    <div class="tv-link">
      <span class="lk-cap">① 评估结论</span>
      ${chips}
      <span class="lk-go">↓ 收敛结论驱动 ② 战役计划（阶段路线 · 意外分支 · 匹配筛选）</span>
    </div>
    <div class="tv-blk">
      <div class="tv-blk-hd"><b>② 战时 · 执行应变</b><i>同步矩阵 · branches &amp; sequels</i><u>第一行＝<b>▲ 出击前置格 ＋ 阶段条</b>，箭头下的 <b style="color:#ffc861">◆＝阶段判断门</b>（DST，悬停看判据，不通过→走意外）；第二行＝<b>★ 主攻主干</b>（绿粗框格：动作）；正下方＝<b>⚡ 意外条</b>（⚠受阻＝branch 自身改走；⚡突变＝介入/政治，卡内 ▸ 全部应对 → sequel 转段）；再下＝∥ 佯攻/斩首支线</u>
        <span class="ko-sum">⚔ 胜负手：${esc(koTxt)}${RTSUM ? `<span style="color:#8fa8ba">　｜　${RTSUM}</span>` : ''}</span></div>
      <div class="tv-box">${svgM}</div>
    </div>
    <div class="tv-legend">
      <i>━━ 当前路径（选中链路）</i><i style="color:#3a556d">── 候选连线</i><i style="opacity:.4">╌╌ 被筛选排除</i>
      <i style="color:#ff9c6e">⚔ 胜负手（决定性阶段，重点标识）</i><i style="color:#c98a5e">▏关键（影响胜负）</i>
      <i style="color:#ffc861">制空评估</i><i style="color:#5ec8c0">制海评估</i><i style="color:#ff9c6e">⚡ 意外事件</i><i style="color:#57c46a">应对分支 → 转段</i>
      <i>右上角数字 = 与当前上游的匹配度（50 中性，越高越契合）</i><i>⟳ = 级联自动推荐（可手选覆盖）</i>
      <i style="color:#8fa8ba">战前评估＝分层 DAG：① 判断（介入深度 ∥ 终局目标）→ ② 战法（首战 ∥ 拒止）→ ③ 评估（空海态势）→ ④ 形态 → ⑤ 方向 → ⑥ 收敛</i>
      <i style="color:#7fd68f">∥ 并行＝同一层内<b>上下堆叠</b>，各自独立大框、留间隔；互不筛选、互不决定，只有跨层的横向箭头才是因果驱动</i>
      <i style="color:#8fd3e6">② 一棵树：第一行＝<b>▲ 出击前置格 ＋ 阶段条</b>（单行不折行）→ ★绿粗框＝主攻主干、视觉最重，∥细虚框＝佯攻/斩首支线；每列格＝该阶段的作战线动作</i>
      <i style="color:#6f899b">⚡ 意外条（主攻正下方，按阶段列对齐）：⚠＝路径受阻改走；⚡卡＝阶段意外＋<b>全部应对分支</b>（▸ 一行一条，⇢ 后是转段目标，悬停点亮目标阶段条，点击看完整意外卡）</i>
      <i style="color:#8fd3e6">▲ 出击前置＝第一行最左格：制空/制海状态（未达「稳固」变橙＋⚠）→ 意外条内 ⚠ 受阻分支生效</i>
      <i style="color:#ff9c6e">⚔ 胜负手环节</i><i style="color:#ffd76a">★ 重点（决定性动作）</i><i style="color:#ff7a7a">⛰ 难点（最可能受阻处）</i>
      <i style="color:#8fa8ba">⚠＝路径受阻分支（当前条件已触发的 ● 亮橙）、⚡＝阶段意外（⇢ 首要应对/转段；全部应对在详情面板）；斩首＝独立时间轴的空中投放，⏹ 达成即止</i>
      <i style="color:#d9b8ef">⏹ 达成即止＝斩首速战速决：H+8 前政权瘫痪，后续阶段整体跳过</i>
      <i style="color:#ffb066">围而不打＝封锁态：主干整条切换（橙虚线卡），不出现登陆地点，路线改为封锁线与打击目标</i>
    </div>
  </section>`;
  window.__TVND = NDMAP;
  col.querySelectorAll('.tv-svg').forEach(sv => sv.addEventListener('click', e => {
    const g = e.target.closest('.nd[data-n]');
    if (g) openDetail(g.dataset.n);
  }));
  
  col.querySelectorAll('.tv-svg').forEach(sv => {
    const hi = el => { sv.querySelectorAll('.nd.hi-to').forEach(x => x.classList.remove('hi-to')); if (el) el.classList.add('hi-to'); };
    sv.addEventListener('mouseover', e => {
      const g = e.target.closest('.nd[data-to]');
      hi(g ? sv.querySelector(`.nd[data-n="${g.dataset.to}"]`) : null);
    });
    sv.addEventListener('mouseleave', () => hi(null));
  });
  
  col.querySelectorAll('.tv-pre').forEach(el => {
    el.onclick = () => {
      const p = pres[+el.dataset.p], keys = Object.keys(p.sel);
      for (const c of sd5.vars) {
        selAll[side][c.id] = keys.includes(c.id) ? p.sel[c.id] : null;
        manAll[side][c.id] = keys.includes(c.id) ? 1 : 0;
        delete autoAll[side][c.id];
      }
      autoFill(side); saveState(); renderAll();
    };
  });
  col.querySelector('#tvOptBtn').onclick = () => document.getElementById('sgLayout').classList.toggle('tv-opt');
  if (qs.get('tvs')) col.querySelector('.tv-box').scrollLeft = +qs.get('tvs');   
  if (qs.get('tvn')) setTimeout(() => openDetail(qs.get('tvn')), 60);            
  if (TV.sel) openDetail(TV.sel);
}


function openDetail(nid) {
  TV.sel = nid;
  const stages = (DATA.sides[side] || {}).trunk || [];   
  const el = document.getElementById('tvDetail');
  const n = window.__TVND && window.__TVND[nid];
  let html = '';
  const K = { val: ['变量选项', 'var(--ac)'], asn: ['空海态势（派生）', '#8fb7d0'], airv: ['制空评估档', '#ffc861'], seav: ['制海评估档', '#5ec8c0'], ly: ['战役布局', '#b98ce0'], stg: ['阶段', 'var(--ac)'], ch: ['意外事件', '#ff9c6e'], br: ['应对分支', '#57c46a'],
    rtcell: ['路径环节', '#8fd3e6'], rtbr: ['受阻分支', '#ff9c6e'], rtgate: ['出击前置', '#8fd3e6'], rtlane: ['作战线', '#57c46a'] };
  if (!n) { html = '<div class="dh"><b>节点不存在</b></div>'; }

  bar.innerHTML =
    '<span class="ttl">我的战略<em>' + esc(S(side).cn) + ' · 已存 ' + arr.length + ' 套</em></span>'
    + (chips || '<span style="font-size:11.5px;color:#7b93a6">还没有自定义战略 —— 在下方决策树把各项选好，点右边「＋ 存为我的战略」</span>')
    + '<button class="ms-add" id="msAddBtn" title="把当前决策树的逐变量选值存成一套命名战略（战略1 / 战略2 … 可自己起名）">＋ 存为我的战略</button>'
    + '<span class="ms-edit" id="msEdit"><input id="msName" maxlength="24" placeholder="战略名，默认 战略' + (arr.length + 1)
    + '"><button class="ms-btn" id="msOk">保存</button><button class="ms-btn" id="msCancel">取消</button></span>'
    + '<button class="ms-btn" id="msOver"' + (loadedId ? '' : ' disabled') + ' title="用当前决策树的选择覆盖已载入的那套战略（名称不变）">⟳ 覆盖</button>'
    + '<button class="ms-btn warn" id="msDel"' + (loadedId ? '' : ' disabled') + ' title="删除当前载入的那套战略">✕ 删除</button>'
    + '<div class="cur" id="msHintLine">当前决策树：<b>' + (curN ? esc(MS.summary({ sel: cur }, MS_ORDER[side])) : '未选')
    + '</b> <u>（共 ' + curN + '/' + sd5.vars.length + ' 项已定）</u></div>';

  bar.querySelectorAll('.ms-chip').forEach(el => {
    el.onclick = ev => {
      const delId = ev.target && ev.target.dataset && ev.target.dataset.del;
      if (delId) {
        ev.stopPropagation();
        const rec = MS.get(side, delId); if (!rec) return;
        if (!confirm('删除战略「' + rec.name + '」？删除后战场页顶栏不再显示它。')) return;
        MS.remove(side, delId);
        if (msLoaded[side] === delId) msLoaded[side] = null;
        renderMyStrat();
        msSay('已删除 <b>' + esc(rec.name) + '</b>');
        return;
      }
      const rec = MS.get(side, el.dataset.id);
      if (rec) msApply(rec);
    };
  });
  const addBtn = bar.querySelector('#msAddBtn');
  if (addBtn) addBtn.onclick = () => {
    const ed = bar.querySelector('#msEdit'); ed.classList.add('on');
    const inp = bar.querySelector('#msName'); inp.value = MS.suggestName(side);
    inp.focus(); inp.select();
  };
  const ok = bar.querySelector('#msOk'); if (ok) ok.onclick = () => msDoSave(true);
  const cancel = bar.querySelector('#msCancel');
  if (cancel) cancel.onclick = () => bar.querySelector('#msEdit').classList.remove('on');
  const inp = bar.querySelector('#msName');
  if (inp) inp.onkeydown = ev => { if (ev.key === 'Enter') msDoSave(true); if (ev.key === 'Escape') bar.querySelector('#msEdit').classList.remove('on'); };
  const over = bar.querySelector('#msOver'); if (over) over.onclick = () => msDoSave(false);
  const del = bar.querySelector('#msDel');
  if (del) del.onclick = () => {
    const rec = msLoaded[side] ? MS.get(side, msLoaded[side]) : null;
    if (!rec) { msSay('先点一套战略（chip）载入，再删除'); return; }
    if (!confirm('删除战略「' + rec.name + '」？')) return;
    MS.remove(side, rec.id); msLoaded[side] = null;
    renderMyStrat(); msSay('已删除 <b>' + esc(rec.name) + '</b>');
  };
}


function syncLayout() {
  const el = document.getElementById('sgLayout');
  el.classList.toggle('tvfull', view === 'tree');
  el.classList.toggle('tv-opt', view === 'tree' && qs.has('tvopt'));   
}
function renderMain() {
  syncLayout();
  if (view === 'matrix') renderMatrix();
  else if (view === 'eval') renderEval();
  else if (view === 'trunk') renderTrunk();
  else renderTree();
}
function renderAll() { autoFill(side); renderPosture(); renderViews(); renderOpts(); renderMain(); renderMyStrat(); if (window.__diag) window.__diag(); }   
renderAll();
</script>
</body>
</html>
